<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Svelp</title>
    <script>
      (function () {
        var bal_segment = location.pathname.split('/').filter(Boolean)[0];
        var bal_base = bal_segment ? '/' + bal_segment + '/' : '/';
        var bal_target = bal_base + (location.hash || '');
        location.replace(bal_target);
      })();
    </script>
  </head>
  <body>
    <p>Open <a href="/">Svelp</a>.</p>
  </body>
</html>
